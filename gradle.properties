org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.native.useEmbeddableCompilerJar=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.6.1 was tested up to compileSdk 35 and warns on 36. compileSdk 36 is required to
# target API 36, which Play requires from 2026-08-31. The alternative, bumping AGP, forces
# the Gradle wrapper plus SakhiCore and PredictionSDK up with it, because Gradle rejects
# mixed AGP versions across a composite build. Remove this line whenever AGP does move.
android.suppressUnsupportedCompileSdk=36
