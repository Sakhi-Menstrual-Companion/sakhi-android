[versions]
# Kotlin/KSP MUST match SakhiCore (02-Platforms/00-Shared/SakhiCore/build.gradle.kts)
# exactly. AGP is a SEPARATE Gradle plugin applied per-project even inside a composite
# build, so it does not have to match SakhiCore's own 8.4.2 — but it does have to stay
# resolvable under this project's shared Gradle wrapper (8.7, copied from SakhiCore).
# 8.6.1 is the smallest bump that satisfies Compose's own AGP floor (verified by a real
# build failure: androidx.compose.ui:ui-android:1.11.4 requires AGP 8.6.0+) while
# staying compatible with Gradle 8.7 — no wrapper bump needed.
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
agp = "8.6.1"
# Lint tooling version = AGP version + 23.0.0 (the tools/lint versioning offset).
lintTools = "31.6.1"
# Gradle Play Publisher: uploads the signed AAB to a Play track from the command line.
playPublisher = "3.11.0"
googleServices = "4.4.2"

# compose-bom itself has no steep AGP floor; kept at latest. The libraries below
# (lifecycle/activity/core-ktx) are INTENTIONALLY NOT "latest" — their newest releases
# (2.11.0 / 1.13.0 / 1.19.0) require AGP 9.1.0+ and, for core-ktx, compileSdk 37 (not
# even installed locally). Verified by a real build failure. Pinned instead to the
# last versions from the AGP-8.x / compileSdk-35 compatible era. Bumping the whole
# stack together (AGP 9.x + Gradle 9.x + compileSdk 37 + SDK platform install) is a
# deliberate, separately-verified follow-up — see plan Section 10 risks — not something
# to back into via mismatched "latest" picks per library.
composeBom = "2026.06.01"
navigationCompose = "2.9.8"
# NOT 4.2.x — those artifacts are compiled against Kotlin 2.3.x stdlib metadata,
# incompatible with our pinned Kotlin 2.1.20 compiler (verified by a real build
# failure). 4.1.1 is the newest Koin release still built against Kotlin 2.1.20.
koin = "4.1.1"
lifecycle = "2.8.6"
coroutines = "1.10.1"
# First ViewModel-level unit test in the repo (PartnerChecklistViewModelTest) needs
# real fakes for concrete, non-open KMM/platform collaborators (SessionManager,
# AIRepository, AndroidHapticManager have no interfaces to hand-roll a fake against)
# and a controllable dispatcher for viewModelScope coroutines -- mockk + coroutines-test
# are the standard, minimal, testImplementation-only way to do both; zero production/APK
# impact.
mockk = "1.13.13"
coreKtx = "1.13.1"
activityCompose = "1.9.2"
# Chrome Custom Tabs -- the standard Android equivalent of iOS's
# `SFSafariViewController`, for opening external links (e.g. the ACOG source in
# onboarding's period/cycle length info sheet) inside an in-app web view instead of
# handing off to the full external browser app.
browser = "1.8.0"
workManager = "2.9.0"
healthConnect = "1.1.0-alpha12"
glance = "1.1.1"
# Messaging transport only (Android has no APNs equivalent -- FCM is the real
# push transport here, same as iOS keeps Firebase for Crashlytics/Analytics
# alongside its own raw-APNs push path). `google-services.json` (2026-07-17,
# app/google-services.json, git-ignored) and the `google-services` Gradle
# plugin are now both wired in `:app` -- `FirebaseApp` has real default
# project config.
firebaseBom = "33.1.2"
playServicesLocation = "21.3.0"
# NOT 6.x (current line reviewed 2026-07-17) -- 6.12.0 is published with
# Compose BOM 2025.09.01, `androidx.core:core-ktx:1.17.0`, Kotlin stdlib
# 2.2.20, and compiled class metadata `mv=[2,2,0]`. This repo is pinned to
# Kotlin 2.1.20 and the map lane still lacks an in-sandbox compile check
# against the sibling composite build, so taking the 6.x jump would mean
# depending on newer Kotlin metadata than the project compiler has been verified
# to consume. 5.0.3 stays on Kotlin 1.9.23 / metadata `mv=[1,9,0]`, keeps the
# lower core-ktx requirement, and still exposes every Maps Compose API used by
# `feature/ai/ChatScreen.kt`.
mapsCompose = "5.0.3"
# core-splashscreen, restored 2026-09-12 after being dropped on 2026-07-04.
#
# The 2026-07-04 note said "1.0.1's SplashScreen API failed to resolve under every
# calling convention". Git history starts after that change, so why it failed is not
# recorded. What is verified (2026-09-12): with `implementation(libs.androidx.core.
# splashscreen)` declared in :app, `:app:assembleDebug` builds cleanly and the API
# resolves through the companion-scoped extension:
#
#     import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen
#     installSplashScreen()   -- before super.onCreate()
#
# It is not cosmetic either. Without it a cold start shows THREE separate things in a
# row — the system's own icon splash (Android 12+ draws one whether or not the app asks),
# then a bare `windowBackground` colour while the process warms, then Compose's first
# frame. That handoff is the "app pops in" jump. See MainActivity for how it is wired.
coreSplashscreen = "1.0.1"

# Screenshot-test durability lane (2026-07-15), on top of the manual visual + flow
# parity gate above, not a substitute for it. Roborazzi over Paparazzi: it renders
# through real Robolectric + the actual `androidx.compose.ui.test` APIs (the same
# `ComposeTestRule` shape already familiar from this app's own Compose code), so it
# has no separate native-rendering-layer version floor to track against our pinned
# AGP/Kotlin/compileSdk stack the way Paparazzi's LayoutLib shim historically has.
# NOT 1.61.0+ -- Roborazzi bumped to Kotlin 2.3.21 stdlib metadata starting in
# 1.61.0, incompatible with our pinned Kotlin 2.1.20 compiler (verified by a real
# build failure: "Module was compiled with an incompatible version of Kotlin...
# expected version is 2.1.0"). Same root cause as the Koin 4.1.1-not-4.2.x pin
# above. 1.60.0 is the newest release still built against Kotlin 2.1.20, confirmed
# live against Maven Central (its artifact is an .aar, not a plain .jar).
roborazzi = "1.60.0"
robolectric = "4.16.1"
baselineProfile = "1.4.1"
uiAutomator = "2.4.0"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.3.0"

# Structured logging (2026-08-01). Kermit over Timber because it is the same
# Touchlab KMP logger SakhiCore could adopt later in commonMain, so Android and any
# future shared-side logging stay on one API instead of two.
# NOT 2.0.8 / 2.1.0 -- both publish against kotlin-stdlib 2.2.0, i.e. class metadata
# newer than this project's pinned Kotlin 2.1.20 compiler can read. Same root cause
# as the Koin 4.1.1-not-4.2.x, maps-compose 5.0.3-not-6.x, and Roborazzi
# 1.60.0-not-1.61.0 pins above. 2.0.6 is the newest release still built against a
# 2.0.x stdlib (2.0.21), confirmed live against Maven Central's poms.
kermit = "2.0.6"

[libraries]
# ── Custom lint checks (:lint module) ───────────────────────────────────────────────
lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "lintTools" }
lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "lintTools" }
lint-tests = { group = "com.android.tools.lint", name = "lint-tests", version.ref = "lintTools" }

# ── Gradle plugin artifacts, consumed ONLY by build-logic/convention ─────────────────
# These are the plugins' own jars, declared as `compileOnly` there so the convention
# plugins can call AGP/Kotlin/Compose DSL types directly. They are NOT app dependencies.
# Versions come from the same catalog entries the app uses, so a convention plugin can
# never compile against a different AGP than the one applied to the modules.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging-ktx = { group = "com.google.firebase", name = "firebase-messaging-ktx" }
google-play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
google-maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kermit = { group = "co.touchlab", name = "kermit", version.ref = "kermit" }

junit = { group = "junit", name = "junit", version = "4.13.2" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "baselineProfile" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "baselineProfile" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiAutomator" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
# NOTE: this project's own convention plugins (build-logic/) are deliberately NOT aliased
# here. A catalog plugin entry with no version is rejected on Gradle 8.7 ("plugin version
# '' is invalid"); version-less aliases only became valid in a later Gradle. Modules apply
# them directly instead — `id("sakhi.android.library")` — which needs no version because
# they resolve from the included build. Revisit if the wrapper is ever bumped.

android-application = { id = "com.android.application", version.ref = "agp" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
