[versions]
# Kotlin/KSP MUST match SakhiCore (02-Platforms/00-Shared/SakhiCore/build.gradle.kts)
# exactly. AGP is a SEPARATE Gradle plugin applied per-project even inside a composite
# build, so it does not have to match SakhiCore's own 8.4.2 — but it does have to stay
# resolvable under this project's shared Gradle wrapper (8.7, copied from SakhiCore).
# 8.6.1 is the smallest bump that satisfies Compose's own AGP floor (verified by a real
# build failure: androidx.compose.ui:ui-android:1.11.4 requires AGP 8.6.0+) while
# staying compatible with Gradle 8.7 — no wrapper bump needed.
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
agp = "8.6.1"

# compose-bom itself has no steep AGP floor; kept at latest. The libraries below
# (lifecycle/activity/core-ktx) are INTENTIONALLY NOT "latest" — their newest releases
# (2.11.0 / 1.13.0 / 1.19.0) require AGP 9.1.0+ and, for core-ktx, compileSdk 37 (not
# even installed locally). Verified by a real build failure. Pinned instead to the
# last versions from the AGP-8.x / compileSdk-35 compatible era. Bumping the whole
# stack together (AGP 9.x + Gradle 9.x + compileSdk 37 + SDK platform install) is a
# deliberate, separately-verified follow-up — see plan Section 10 risks — not something
# to back into via mismatched "latest" picks per library.
composeBom = "2026.06.01"
navigationCompose = "2.9.8"
# NOT 4.2.x — those artifacts are compiled against Kotlin 2.3.x stdlib metadata,
# incompatible with our pinned Kotlin 2.1.20 compiler (verified by a real build
# failure). 4.1.1 is the newest Koin release still built against Kotlin 2.1.20.
koin = "4.1.1"
lifecycle = "2.8.6"
coroutines = "1.10.1"
coreKtx = "1.13.1"
activityCompose = "1.9.2"
workManager = "2.9.0"
healthConnect = "1.1.0-alpha12"
# Messaging transport only (Android has no APNs equivalent -- FCM is the real
# push transport here, same as iOS keeps Firebase for Crashlytics/Analytics
# alongside its own raw-APNs push path). No `google-services` Gradle plugin
# applied -- that needs a real `google-services.json` this repo doesn't have
# yet (see plan Section 7), so `FirebaseApp` has no default project config
# until that file is added. The dependency and service class are still real,
# buildable, and verified-compiling now so the only remaining step later is
# dropping in the JSON, not writing the integration from scratch.
firebaseBom = "33.1.2"
# core-splashscreen dropped (2026-07-04): 1.0.1's SplashScreen API failed to resolve
# under every calling convention (top-level extension, static call, explicit
# Companion call — verified by real build failures). Not worth chasing for a
# cosmetic feature; MainActivity uses the system default cold-start treatment until
# a themed splash is wired in the design-system pass (plan Section 4/8).

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging-ktx = { group = "com.google.firebase", name = "firebase-messaging-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
