name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Thin-shell audit
        run: python3 Scripts/audit_kmm_thin_shell.py --strict

      - name: Ktlint and detekt
        run: ./gradlew ktlintCheck detekt

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle build
        run: ./gradlew build

      - name: Android unit tests
        run: ./gradlew test

      - name: Assemble debug app
        run: ./gradlew :app:assembleDebug

      - name: SakhiCore jvmTest
        run: |
          # Composite-build task name may need to be trued up once the scaffold lands.
          ./gradlew :SakhiCore:jvmTest
