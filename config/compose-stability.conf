// Compose compiler stability configuration
//
// WHY THIS FILE EXISTS
//
// SakhiCore is a KMM module. It applies kotlin("multiplatform"), com.android.library,
// serialization, KSP and Room — but NOT the Compose compiler plugin (see its
// build.gradle.kts). The Compose compiler can only infer a class's stability when that
// class was compiled with the Compose plugin, which writes the stability metadata it later
// reads. For every other module it has nothing to read, so it assumes the worst and treats
// the type as UNSTABLE.
//
// That assumption covers essentially every type our UI displays: PeriodLog, CycleData,
// SessionContext, CyclePhase and the rest. Unstable parameters force Compose to fall back
// to instance-identity (===) comparison when deciding whether a composable can skip, so any
// newly-allocated instance defeats skipping and recomposes the subtree.
//
// Each line below names a type the compiler should treat as stable.
//
// SAFETY: a line here is a PROMISE to the compiler that instances never change observably
// without a new instance being created. Break that promise and Compose will skip a
// recomposition it needed to run, and the UI silently shows stale data. On a health app that
// is a correctness bug, not a cosmetic one. So every entry below was verified against the
// source before being added, and the packages that failed that check are listed at the
// bottom with the reason.

// ── Verified: pure data, every property a `val`, no mutable collections, no subpackages ──
// Checked with: grep for `var `, MutableList/MutableMap/MutableSet and Array<> across the
// package — all clean. This is the big one: 176 imports across the Android UI, and it is
// where PeriodLog, CycleData, CyclePhase, Symptom and Mood all live.
team.sakhi.models.**

// ── Verified: design tokens, all `object`s and val-only data classes ──
// ColorScale / ColorGroup / ColorPair / PhaseColorBundle / ResolvedBundle are val-only data
// classes; ResolvedColors holds a single `private val`. 25 imports in the UI.
team.sakhi.design.**

// ── Verified: stateless date helper ──
// DateConverter is a stateless `object`. LocalDate flows through Home and Calendar state
// constantly (selectedDate, the periodLogDates set, every calendar cell).
team.sakhi.date.**

// ── Verified individually, NOT by package ──
// `team.sakhi.session` is deliberately NOT wildcarded, see the exclusion note below. These
// three are the read-only value types out of it, and each was checked to be val-only.
team.sakhi.session.SessionContext
team.sakhi.session.SessionPermissions
team.sakhi.session.Permission

// ── Verified: cycle insight value types ──
// `CyclePhaseInsight` is a stateless `object`; the types that matter are nested inside it,
// notably `PeriodPredictionSnapshot` (six Ints, an enum and a nullable Long, all `val`).
// No `var` anywhere in the package. `**` rather than `*` because these are NESTED types:
// the compiler matches on the full name `team.sakhi.cycle.CyclePhaseInsight.
// PeriodPredictionSnapshot`, which a single-segment `*` does not reach. Added after a
// metrics run showed `HomeHeroState` still unstable for exactly this one field.
team.sakhi.cycle.**

// ── Verified individually, NOT by package ──
// `SyncRuntimeState` is a sealed class whose subclasses are Idle/Syncing plus
// `Success(lastSyncedAt)` and `Failed(error)`, all immutable. The surrounding
// `team.sakhi.sync` package is NOT wildcarded, see the exclusion note below.
team.sakhi.sync.SyncRuntimeState
team.sakhi.sync.SyncRuntimeState.**

// ── kotlinx.datetime value types ──
// Immutable by contract, and from a library with no Compose plugin, so they hit exactly the
// same inference gap. LocalDate in particular is a key in most of our remember() blocks.
kotlinx.datetime.LocalDate
kotlinx.datetime.LocalDateTime
kotlinx.datetime.LocalTime
kotlinx.datetime.Instant
kotlinx.datetime.DatePeriod
kotlinx.datetime.DateTimePeriod

// ── DELIBERATELY EXCLUDED, do not add these ────────────────────────────────────────────
//
// team.sakhi.session.*   — the package also holds SessionManager, UserSessionCache and
//                          DeviceSessionGuard, which all carry mutable internal state.
//                          Wildcarding the package would promise stability for those too,
//                          and a session/permission change that failed to recompose would
//                          mean showing one user's data under another user's session. The
//                          three value types above are listed individually for this reason.
//
// team.sakhi.repositories.* — repositories hold caches and in-flight state.
//
// team.sakhi.sync.*      — SyncQueue exposes a public `var onRetrySync`, and SyncStore,
//                          SyncEngine and SyncPauseState all hold mutable internal state.
//                          Only the SyncRuntimeState value type above is safe.
//
// kotlin.collections.*   — marking List/Map/Set stable is a common trick and it is a real
//                          gamble: the interfaces permit a MutableList underneath, and an
//                          in-place mutation would then never repaint. Our lists are
//                          already reached through the model classes above, so we get the
//                          benefit without making that promise.
